<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Chat Assistant</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: Arial, sans-serif;
			background: #212121;
			color: #ececec;
			height: 100vh;
			overflow: hidden;
		}

		.app {
			display: flex;
			height: 100vh;
		}

		/* Sidebar */
		.sidebar {
			width: 260px;
			background: #171717;
			padding: 20px;
			display: flex;
			flex-direction: column;
		}

		.logo {
			font-size: 21px;
			font-weight: bold;
			margin-bottom: 30px;
		}

		.new-chat {
			background: #252525;
			border: 1px solid #444;
			color: white;
			padding: 13px;
			border-radius: 9px;
			cursor: pointer;
			text-align: left;
			font-size: 14px;
		}

		.new-chat:hover {
			background: #333;
		}

		.sidebar-footer {
			margin-top: auto;
			color: #999;
			font-size: 12px;
		}

		/* Main chat */
		.main {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-width: 0;
		}

		.topbar {
			padding: 20px 30px;
			border-bottom: 1px solid #333;
			font-size: 17px;
			font-weight: bold;
		}

		.chat-container {
			flex: 1;
			overflow-y: auto;
			padding: 30px 20px 20px;
		}

		.welcome {
			text-align: center;
			margin: 100px auto 0;
			max-width: 600px;
		}

		.welcome h1 {
			font-size: 30px;
			margin-bottom: 15px;
		}

		.welcome p {
			color: #aaa;
		}

		.message {
			max-width: 850px;
			margin: 0 auto 25px;
			display: flex;
			gap: 15px;
			line-height: 1.7;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.avatar {
			width: 35px;
			height: 35px;
			min-width: 35px;
			border-radius: 50%;
			display: grid;
			place-items: center;
			font-weight: bold;
		}

		.user-avatar {
			background: #555;
		}

		.ai-avatar {
			background: #10a37f;
		}

		.message-content {
			padding-top: 5px;
			flex: 1;
		}

		.message-name {
			font-weight: bold;
			margin-bottom: 7px;
		}

		/* Input area */
		.input-area {
			padding: 15px 20px 25px;
		}

		.input-box {
			max-width: 850px;
			margin: auto;
			background: #2f2f2f;
			border: 1px solid #555;
			border-radius: 16px;
			padding: 12px 15px;
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.input-box textarea {
			flex: 1;
			background: transparent;
			border: none;
			outline: none;
			color: white;
			font-size: 15px;
			resize: none;
			max-height: 150px;
			font-family: inherit;
		}

		.input-box textarea::placeholder {
			color: #aaa;
		}

		.send-btn {
			background: #10a37f;
			border: none;
			color: white;
			width: 38px;
			height: 38px;
			border-radius: 10px;
			cursor: pointer;
			font-size: 19px;
		}

		.send-btn:hover {
			background: #0d8d6e;
		}

		.send-btn:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.disclaimer {
			text-align: center;
			color: #888;
			font-size: 11px;
			margin-top: 12px;
		}

		.typing {
			color: #aaa;
			font-style: italic;
		}

		@media(max-width: 700px) {
			.sidebar {
				display: none;
			}

			.topbar {
				padding: 17px;
			}

			.welcome h1 {
				font-size: 24px;
			}

			.chat-container {
				padding: 20px 12px;
			}
		}
	</style>
</head>

<body>

	<div class="app">

		<!-- Sidebar -->
		<aside class="sidebar">

			<div class="logo">✦ AI Assistant</div>

			<button class="new-chat" onclick="newChat()">
				+ &nbsp; New Chat
			</button>

			<div class="sidebar-footer">
				Powered by Spring AI
			</div>

		</aside>

		<!-- Main -->
		<main class="main">

			<header class="topbar">
				ChatGPT Style Assistant
			</header>

			<section class="chat-container" id="chatContainer">

				<div class="welcome" id="welcome">
					<h1>How can I help you today?</h1>
					<p>Ask me anything. I'm here to help.</p>
				</div>

			</section>

			<!-- Message input -->
			<footer class="input-area">

				<form class="input-box" id="chatForm">

					<textarea id="question" name="question" placeholder="Message AI Assistant..." rows="1"
						required></textarea>

					<button class="send-btn" id="sendBtn" type="submit">
						↑
					</button>

				</form>

				<div class="disclaimer">
					AI can make mistakes. Verify important information.
				</div>

			</footer>

		</main>

	</div>

	<script>

		const chatForm = document.getElementById("chatForm");
		const questionInput = document.getElementById("question");
		const chatContainer = document.getElementById("chatContainer");
		const sendBtn = document.getElementById("sendBtn");

		function addMessage(sender, message, type) {

			const welcome = document.getElementById("welcome");

			if (welcome) {
				welcome.remove();
			}

			const messageDiv = document.createElement("div");
			messageDiv.className = "message";

			const avatar = document.createElement("div");
			avatar.className = "avatar " +
				(type === "user" ? "user-avatar" : "ai-avatar");

			avatar.textContent = type === "user" ? "U" : "AI";

			const content = document.createElement("div");
			content.className = "message-content";

			const name = document.createElement("div");
			name.className = "message-name";
			name.textContent = sender;

			const text = document.createElement("div");
			text.textContent = message;

			content.appendChild(name);
			content.appendChild(text);

			messageDiv.appendChild(avatar);
			messageDiv.appendChild(content);

			chatContainer.appendChild(messageDiv);

			chatContainer.scrollTop = chatContainer.scrollHeight;

			return text;
		}

		chatForm.addEventListener("submit", async function (event) {

			event.preventDefault();

			const question = questionInput.value.trim();

			if (!question || sendBtn.disabled) {
				return;
			}

			addMessage("You", question, "user");

			questionInput.value = "";
			questionInput.style.height = "auto";

			sendBtn.disabled = true;

			const aiMessage = addMessage(
				"AI Assistant",
				"Thinking...",
				"ai"
			);

			aiMessage.classList.add("typing");

			try {

				const response = await fetch("/sendMsg", {
					method: "POST",
					headers: {
						"Content-Type":
							"application/x-www-form-urlencoded"
					},
					body: new URLSearchParams({
						question: question
					})
				});

				if (!response.ok) {
					throw new Error("Server error: " + response.status);
				}

				const answer = await response.text();

				aiMessage.classList.remove("typing");
				aiMessage.textContent = answer || "No response received.";

			} catch (error) {

				aiMessage.classList.remove("typing");
				aiMessage.textContent =
					"Sorry, something went wrong. Please try again.";

				console.error(error);

			} finally {

				sendBtn.disabled = false;
				questionInput.focus();
				chatContainer.scrollTop = chatContainer.scrollHeight;

			}

		});

		questionInput.addEventListener("keydown", function (event) {

			if (event.key === "Enter" && !event.shiftKey) {
				event.preventDefault();
				chatForm.requestSubmit();
			}

		});

		questionInput.addEventListener("input", function () {

			this.style.height = "auto";
			this.style.height = Math.min(this.scrollHeight, 150) + "px";

		});

		function newChat() {
			chatContainer.innerHTML = `
            <div class="welcome" id="welcome">
                <h1>How can I help you today?</h1>
                <p>Ask me anything. I'm here to help.</p>
            </div>
        `;
			questionInput.value = "";
			questionInput.focus();
		}

	</script>

</body>

</html>
